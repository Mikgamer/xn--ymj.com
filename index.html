<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ⵍ</title>
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<!-- The ⵍ is drawn in 3D by main.js (three.js). This link stays for keyboard
	     users, and shows the plain glyph if the 3D version can't load. -->
	<a id="link" href="http://mikgamer.fr" aria-label="ⵍ — mikgamer.fr">
		<img id="fallback" src="ⵍ.svg" alt="ⵍ" draggable="false">
	</a>
	<script type="module" src="main.js"></script>
</body>
</html>
